name: CI

# The whole file. Every service in the estate calls the ONE reusable workflow in micro-org rather
# than carrying its own copy — the measured target in docs/ecosystem/03 §5 is zero bespoke CI files.
# If this repository ever needs a job of its own, that is the signal the reusable workflow needs an
# input, not that this repository needs a fork of it.
#
# `service-ci.yml` typechecks, runs the suite against a real Postgres, and FAILS the build if the
# database-backed suite skipped — which is why `src/testsupport.ts` reads
# `LANTERN_TEST_DATABASE_URL` spelled exactly as the workflow exports it. It also enforces the estate
# rules (one database, no cross-service imports, the three health endpoints, no unleased timers) that
# repository walls used to enforce for free.
#
# ══════════════════════════════════════════════════════════════════════════════════════════════════
# WAVE M1b: THIS REPOSITORY OWNS TWO DATABASES, AND SAYING SO IS NOT COSMETIC.
#
# `database-env-var` is a LIST since micro-org#519. Every name in it gets its own CI database, its
# own exported pair, and — the part that matters — is treated as OWN by the skip scan.
#
# Declaring only `LANTERN_DATABASE_URL` here would not have been red. It would have been GREEN with
# ten analytics suites silently skipped: `idempotency`, `ingest`, `jobs`, `metric definitions`,
# `migrations`, `pseudonym`, `reads`, `rotating the pepper`, analytics' `the HTTP surface`, and
# `the merged surface`. Measured on this branch — with only the lantern DSN exported the suite
# reports **367 pass / 0 fail** instead of 615, and every one of those ten prints
# `set ANALYTICS_TEST_DATABASE_URL`. The OLD skip scan read a foreign variable name as "a
# cross-service tier stood down" and emitted a notice; with `ANALYTICS_DATABASE_URL` declared here,
# the same lines are the disaster the block exists for and the build fails.
#
# The two databases must also be SEPARATE, which the shared workflow now does per declared name.
# Both modules own a table called `events` and a table called `jobs` (`migratortargets.test.ts`
# measures it), so one shared database would have one suite truncating the other's rows mid-test —
# a flake, not a legible configuration error.
# ══════════════════════════════════════════════════════════════════════════════════════════════════

on:
  push:
    # `release/**` builds too. A release branch carries the estate-wide version bump, and it
    # has to publish its images before testnet can be deployed from it — which is what proves
    # the release before anything is merged. Mainnet is unaffected: it pins a version tag.
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: lantern
      # Both, whitespace-separated. See the block at the top of this file for what declaring only
      # the first would have cost, measured rather than guessed.
      database-env-var: LANTERN_DATABASE_URL ANALYTICS_DATABASE_URL
      port: 4010
      # The image startup smoke test boots the real service, and `env.ts` validates its
      # configuration at import — so the container needs the variables it declares, not just a
      # database, or it exits before it serves /livez. The JWKS URL is never dialled, because /livez
      # needs no identity. Never a real credential.
      #
      # `LANTERN_TOKEN=@generate` asks service-ci.yml for a fresh `openssl rand -base64 48` per run,
      # thrown away afterwards. The line used to read
      # `LANTERN_TOKEN=ci-only-not-a-real-token-0000000000000`, described in this comment as "a
      # throwaway token that only has to clear a length check" — which is the defect stated out loud
      # in configuration, and is exactly what @cloudsforge/secrets now refuses: `ci-only` and
      # `not-a-real` are both placeholder markers, and the guard has no CI exemption on purpose
      # (micro-org #142), because an escape hatch is reached for in the same hurry that produced the
      # defect. CI does not need a WEAK secret, it needs A secret — nothing in the smoke test
      # verifies a signature — so it generates a real one per run rather than committing a
      # high-entropy literal that a future reader could mistake for a key.
      #
      # THE ANALYTICS HALF'S THREE VARIABLES ARE HERE FOR THE SAME REASON. Since wave M1b this image
      # boots `src/analytics/module.ts`, which imports its own `env.ts` — so the merged container
      # exits before it binds a socket unless the analytics configuration is present too. All three
      # are `@generate`: a REAL `ANALYTICS_PSEUDONYM_KEY` must never appear in a workflow file, an
      # image layer, or anywhere a repository read grants access to, and a placeholder is exactly
      # what @cloudsforge/secrets refuses. Nothing is ingested during the smoke test, so the pepper
      # pseudonymises nothing either way — generating one per run is honest in a way a literal
      # never was.
      smoke-env: |
        LANTERN_TOKEN=@generate
        ANALYTICS_PSEUDONYM_KEY=@generate
        ANALYTICS_TOKEN=@generate
        ANALYTICS_DELIVERY_SECRETS=@generate
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
    secrets:
      # @cloudsforge/* is resolved by link:../runtime, so CI checks out micro-runtime and
      # micro-contracts as siblings — both private, so the workflow needs a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts, image name derived
  # at tools/registry.ts); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts); and deploy/scripts/release-deploy.sh refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [ci, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
